[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "invoiceops"
version = "0.1.0"
description = "Invoice and payment ticket multilabel classification workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "psutil>=7,<8",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "safetensors>=0.6,<1",
  "scikit-learn>=1.7,<2",
  "sentencepiece>=0.2,<1",
  "sqlalchemy>=2,<3",
  "streamlit>=1.48,<2",
  "torch>=2.7,<3",
  "transformers>=4.55,<5",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceops"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
