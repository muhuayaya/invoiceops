[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceops"
version = "0.1.0"
description = "Invoice operations multi-label triage PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "jsonschema==4.23.0",
  "PyYAML==6.0.2",
  "python-multipart==0.0.20",
  "PyJWT==2.10.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "celery==5.4.0",
  "mlflow==2.17.2",
  "torch==2.5.1",
  "transformers==4.47.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "httpx==0.28.1"]
ml = ["scikit-learn==1.6.0", "pandas==2.2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
